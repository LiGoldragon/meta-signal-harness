[package]
name         = "meta-signal-harness"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-harness"
description  = "Meta signal contract for privileged harness policy operations."
publish      = false

[lib]
name = "meta_signal_harness"
path = "src/lib.rs"

[[test]]
name = "canonical_examples"
path = "tests/canonical_examples.rs"
required-features = ["dotos-text"]

[features]
default = []
dotos-text = ["dep:dotos", "signal-frame/dotos-text", "signal-harness/dotos-text"]

[dependencies]
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "01676293a623d97b65e320d4138c4b480c6d5dad", default-features = false }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness.git", rev = "bf9722f4fd7553b1821ce55dd04fa14efe4e7062", default-features = false }
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror    = "2"

[dev-dependencies]
signal-persona = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "7d2568d420869aa0cded49c3c04cc0ac180e66a2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
